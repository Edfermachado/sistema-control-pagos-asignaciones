services:
  postgres:
    image: postgres:16-alpine
    container_name: scpa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scpa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scpa_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-scpa_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scpa_user} -d ${POSTGRES_DB:-scpa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scpa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-scpa_user}:${POSTGRES_PASSWORD:-scpa_secret_2026}@postgres:5432/${POSTGRES_DB:-scpa_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-uc_facyt_sistemas_informacion_secret_key_2026}
      JWT_EXPIRES_IN: 8h
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scpa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
